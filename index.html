<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Galeria de Arte</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Galeria de Arte</h1>

        <tr>

            <th>Artista</th>
            <th>Data</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody id="resultado"></tbody>
</table>

<script src="script.js"></script>

</body>
</html>
